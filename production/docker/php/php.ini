; Application PHP overrides for production (mounted into conf.d).

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300

; Never leak stack traces to the browser; Laravel's log stack is the only sink.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off

; Opcache: validate_timestamps is off because the source is baked into the
; image and never changes at runtime. Rebuild the image to deploy new code.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096k
realpath_cache_ttl = 600
